<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="A beautiful real-time weather application">

    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="weather-app">

        <!-- Header -->
        <header class="header">
            <h1>
                <span>☀️</span>
                Weather App
            </h1>
        </header>


        <!-- Search -->
        <section class="search-section">

            <input type="text" id="cityInput" placeholder="Search your city..." autocomplete="on" spellcheck="false"
                required>

            <button id="searchBtn">
                🔍
            </button>

        </section>


        <!-- Error Message -->
        <p id="errorMessage" class="error-message"></p>


        <!-- Current Weather -->
        <section class="current-weather">

            <div class="location-info">
                <div>
                    <h2 id="cityName"></h2>
                    <p id="countryName"></p>
                </div>

                <div class="date-time">
                    <p id="date">Monday, 22 Sep</p>
                    <p id="time">4:30 PM</p>
                </div>
            </div>


            <div class="temperature-section">

                <div class="weather-icon" id="weatherIcon" style="color: chartreuse;">
                  Current Condition ?
                </div>

                <div>
                    <span id="temperature"></span>

                </div>

            </div>


            <p class="weather-condition" id="weatherCondition">

            </p>

            <p class="feels-like ">
                <span id="feelsLike"></span>
            </p>

        </section>

        <!-- sunrise and sunset -->
   

        <section class="sun-section">

            <div class="sun-card">
                <span>🌅</span>

                <div>
                    <p>Sunrise</p>
                    <strong id="sunrise"></strong>
                </div>
            </div>

            <div class="sun-card">
                <span>🌇</span>

                <div>
                    <p>Sunset</p>
                    <strong id="sunset"></strong>
                </div>
            </div>

        </section>



        <!-- Weather Details -->
        <section class="weather-details">

            <div class="detail">
                <span>💧</span>
                <div>
                    <p>Humidity</p>
                    <strong id="humidity"></strong>
                </div>
            </div>

            <div class="detail">
                <span>💨</span>
                <div>
                    <p>Wind</p>
                    <strong id="wind"></strong>
                </div>
            </div>

            <div class="detail">
                <span>👁️</span>
                <div>
                    <p>Visibility</p>
                    <strong id="visibility"></strong>
                </div>
            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
